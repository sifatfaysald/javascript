<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">

    <main class="min-h-screen flex items-center justify-center px-4">
        <section class="text-center max-w-xl">
            <h1 class="text-3xl font-semibold mb-4 text-yellow-500">Hello, JavaScript!</h1>

            <p class="text-lg text-gray-700 mb-6">
                JavaScript is a powerful, lightweight programming language that enables interactive web experiences.
                It brings websites to life — from dynamic content updates to real-time functionality.
            </p>

            <blockquote class="italic text-gray-600 border-l-4 border-yellow-400 pl-4">
                "JavaScript is the duct tape of the Internet." <br />
                <span class="block mt-2 text-sm text-gray-500">— Charlie Campbell</span>
            </blockquote>
            <div class="pt-20">
                <button id="eventButton"
                    class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded">
                    Event Handler
                </button>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="./app.js"></script>
</body>

</html>
